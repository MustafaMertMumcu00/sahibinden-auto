version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sahibinden_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sahibinden_rabbitmq
    ports:
      - "5672:5672"     # AMQP port for Python/Flask to publish messages
      - "15672:15672"   # Management UI port (View queues in your browser)
      - "15674:15674"   # Web STOMP port for Angular to connect via WebSockets
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    command: sh -c "rabbitmq-plugins enable rabbitmq_web_stomp && rabbitmq-server"

volumes:
  postgres_data: